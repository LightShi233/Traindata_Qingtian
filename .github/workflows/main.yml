name: TrainData Generation

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  traindata-gen:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure Git committer
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: agnes/agnes-3.0-flash
          use_github_token: true
          prompt: |
            安装并使用 ./traindata skill 为Ruhui编写训练数据。
            硬性要求：
            1. 只允许改动 ./data 目录；严禁修改 .github/、traindata/ 或任何已有源码。
               严禁新增任何 .py 脚本（尤其是 author.py / gen.py 之类的生成器）：
               工具已经现成，你只负责输出 YAML 并调用 traindata/scripts/data_writer.py。

            2. 先用 data_writer.py allocate --count N 领取文件名，把纯 YAML 写到它打印的
               data/inbox/chunk_NNNN.yaml（action 写成映射、长文本用 | 块标量），
               再执行 data_writer.py write 转换。严禁手写、手改或另存 jsonl。
               即使使用子代理，也由主代理统一 allocate，子代理只写分配给它的 YAML 槽位。

            3. 只用 data_writer.py merge --round <id> 合并，且只合并本轮产出；
               严禁 glob 全部 chunk，严禁私自合并其它轮或文件夹中的样本。

            4. 提交前必须运行 data_writer.py check --round <id> --strict 且通过；
               严禁提交任何临时/备份文件（.tmp-*、*.tmp、*.bak、__pycache__ 等）。

            5. 转换与两个 gate 都要带 --timeout；退出码 3 表示该 chunk 未通过，
               缩小 chunk 重来，不要调大超时。

            6. 计时器：本轮有 3 小时墙钟预算（allocate --budget-hours 可调）。
               命令会显示 ⚠/⛔ 计时提示：
               - ⚠ warn（超过 75%）：把手上这份 YAML 写完，不要再开新场景。
               - ⛔ stop（超过 3 小时）：write 会拒绝新 chunk。此时必须立即执行
                 data_writer.py salvage --round <id> --taxonomy data/taxonomy.json --commit
                 把已完成且合法的部分转换、合并并提交。半成品提交算成功，
                 跑满 3 小时却什么都没交是失败。

            7. 完成后提交，开一个 PR 标题前缀为 [traindata_add]
            8. 绝对严禁一次产出超过10个样本，但使用子代理，并且有相应验证时本规则例外
            9. 特别强调多样性原则：用脚本检查，多样性不足时强制更改，或用子代理更改

