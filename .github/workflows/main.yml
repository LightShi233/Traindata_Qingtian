name: TrainData Generation

on:
  workflow_dispatch:
    inputs:
      prompt_extra:
        description: '额外追加到 prompt 末尾的要求（可留空）'
        required: false
        default: ''
        type: string
  schedule:
    - cron: '*/40 * * * *' # 极限压榨：每 40 分钟一趟

# 必须要有这些权限，否则第八条的 gh pr create 会报错
permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

# 强行抢跑，如果上一轮卡住，直接把上一轮踢掉
concurrency:
  group: traindata-gen-${{ github.ref }}
  cancel-in-progress: true 

jobs:
  traindata-gen:
    runs-on: ubuntu-latest
    # 留足 5 分钟给最后的 salvage 和 git push
    timeout-minutes: 45 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure Git identity and branch
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="traindata/qoder-${GITHUB_RUN_ID}"
          git switch -c "$BRANCH"
          echo "TRAINDATA_BRANCH=$BRANCH" >> "$GITHUB_ENV"
          git --version
          python3 --version

      - name: Run Qoder CLI (PAT auth, local model settings)
        id: qoder
        uses: QoderAI/qoder-action@v0
        with:
          qoder_personal_access_token: ${{ secrets.QODER_PERSONAL_ACCESS_TOKEN }}
          qodercli_version: ${{ vars.QODER_CLI_VERSION || '1.1.80' }}
          flags: |
            --dangerously-skip-permissions
            --settings .github/qoder-settings.json
          prompt: |
            按仓库内的 ./traindata/SKILL.md 契约与流程为 Ruhui 编写训练数据
            （这是仓库内的 skill，不需要安装、复制或修改它）。

            第 0 条（元规则，优先于以下所有条款）：
            脚本是唯一权威。data_writer.py / validate_and_integrate.py / audit_diversity.py /
            salt.py 的退出码就是判定结果：0 才算通过，非 0 就是没通过。
            - 你必须服从脚本结论，不得改写、绕过、注释掉或放宽任何检查来让它变绿。
            - 不得用自己的判断、自述或"我认为已经修好了"代替脚本判定；
              每次修复后必须重跑脚本，以退出码为准。
            - 子代理只负责把 YAML 写进分配给它的槽位；write 和两个 gate 只由主代理
              执行，并以主代理看到的退出码为准。子代理自述"已完成/已验证"不构成验证；
              主代理在 write 前先核对子代理回显的 traj_id / payload_span 是否与分配
              清单一致，不一致就整块重派，不要替它补写。
            - 被脚本拒绝时，按它打印的提示修复数据并重跑；不得手改产物文件。

            硬性要求：
            1. 只允许改动默认输出根目录 ./data（CI 的提交与校验只认这个根），
               严禁修改 .github/、traindata/ 或任何已有源码。
               严禁修改 data/taxonomy.json：它是跨 chunk 的稳定契约，改了会让已通过的
               数据全部失效；需要改 taxonomy 时停下报告，不要自行修改。
               严禁新增任何 .py 脚本（尤其是 author.py / gen.py 之类的生成器）：
               工具已经现成，你只负责输出 YAML 并调用 traindata/scripts/data_writer.py。

            1.1 规则从哪里看（重要）：
               开工前先运行 python3 traindata/scripts/data_writer.py brief，
               它会打印流程、YAML 字段和最常见被拒原因。
               需要细节时读 traindata/SKILL.md 和 traindata/references/*.md。
               不要去读 traindata/scripts/ 下的实现源码（dataloader.py、data_writer.py 等）：
               那是工具内部，读它既不会告诉你该写什么，也容易让你跑去改它。
               如果 brief 和文档没覆盖你的疑问，就按脚本的报错信息修数据并重跑，
               而不是翻源码猜。

            2. 地址和 salt 都要在写数据前锁定：
               a) 地址：运行 sample_emails.py --scenario <safe|violation|injection>
                  --count N --cross-map --manifest work/emails.json --ledger work/ledger.txt
                  拿到冻结批次（这里的 N 是地址数，不是 case 数）。
               b) salt：把本轮实际发给模型的生成提示词写到 work/prompt.txt，运行
                  salt.py --in work/prompt.txt --out work/salted_prompt.txt。
                  每一轮都必须登记它；不盖 salt 章的 chunk 不能提交（--require-salt 必失败）。
               c) 再运行 allocate --count <chunk 槽位数> --email-manifest work/emails.json
                  --salted-prompt work/salted_prompt.txt 登记。这里的 --count 是
                  chunk 槽位数，不是 case 数或地址数；一个 pilot chunk 用 1。
               严禁 grep/cat/读取 traindata/assets/email_library/ 下任何文件，
               严禁自己挑域名或用 bash 循环去查"某域名在不在黑名单"。
               理由：那是 28 万行 blocklist，逐个 grep 既慢又没意义；
               手工挑域名会绕过分层加权与 cross-map，让域名变成标签信号。
               write 会拒绝：未登记批次，或样本里出现批次外地址。

            3. 只把纯 YAML 写到 allocate 打印的 data/inbox/<NAME>.yaml
               （action 写成映射、长文本用 | 块标量），然后由主代理执行 write 转换。
               严禁手写、手改或另存 jsonl。已提交的 chunk 是只读的，不能再改；
               修正只针对本轮未提交的 chunk：discard 退回 pending 后同名重写。
               即使使用子代理，也由主代理统一 allocate / write / 跑 gate；
               子代理只把自己那个 chunk 的 YAML 写进分配好的槽位，并回显它写的
               traj_id 与 payload_span，不执行 write 或 gate。

            4. 只用 data_writer.py merge --round <id> 合并，且只合并本轮产出；
               严禁 glob 全部 chunk，严禁私自合并其它轮或文件夹中的样本。

            4.1 cron 每 40 分钟会起一轮，所以同时可能有多个 PR 在路上，它们互相
               看不到对方的数据（allocate 只扫描本分支已有的 chunk）。
               为此 chunk 名自动带本轮 CI run 号后缀：chunk_0007_40840653996。
               不同 run 的编号从同一个起点开始也不会撞，你无需处理。
               traj_id 仍须全域唯一：格式 ruhsoft_<6 位序号>_<8 位随机 hex>。
               - 6 位序号从本轮 chunk 编号派生，例如 chunk_0007_xxx 就写
                 000701、000702…（历史 chunk_0001 -> 000101 就是这个做法）。
               - 后 8 位必须是真正随机的 hex，不要用连续计数器、时间戳或
                 任何可预测的短串——这是两轮撞号时唯一的分隔符。

            5. 每个 chunk 固定按这个顺序，不要跳步：
               预检（YAML 可直接读；此时还没有 salt 章，不要带 --require-salt）：
                 validate_and_integrate.py --check data/inbox/<NAME>.yaml
                   --taxonomy data/taxonomy.json --expand --require-complete-cases --timeout 300
                 audit_diversity.py --chunks data/inbox/<NAME>.yaml
                   --taxonomy data/taxonomy.json --require-injection --strict
                   --require-taxonomy-axes --email-manifest work/emails.json --timeout 300
               通过后 write，再对 data/chunks/<NAME>.jsonl 重跑同样两条命令，
               audit 这次加 --require-salt；最后运行 salt.py --check 该 chunk。
               跨 chunk 去重：把其它轮已验收的 data/rounds/<round>/soft_*.jsonl
               用 --leak 传给 validator；--auto-leak 只搜输入旁边，搜不到 rounds/。
               chunk 通过后才 merge --round <id>；提交前必须运行
               data_writer.py check --round <id> --strict 且通过。
               严禁提交任何临时/备份文件（.tmp-*、*.tmp、*.bak、__pycache__ 等）。

            6. 转换与两个 gate 都要带 --timeout；退出码 3 表示该 chunk 未通过，
               缩小 chunk 重来，不要调大超时。

            7. 计时器：本轮墙钟预算 30 分钟，必须用
               allocate --count <N> --budget-hours 0.5 显式设定（job 在 35 分钟时
               被强制结束，预算必须早于它，否则止损永远来不及触发）。
               命令会显示 ⚠/⛔ 计时提示：
               - ⚠ warn（超过 75%，约 22 分钟）：把手上这份 YAML 写完，不要再开新场景。
               - ⛔ stop（超过 30 分钟）：write 会拒绝新 chunk。此时必须立即执行
                 data_writer.py salvage --round <id> --taxonomy data/taxonomy.json --commit
                 把已完成且合法的部分转换、合并并提交。半成品提交算成功，
                 用完预算却什么都没交是失败。

            8. 完成后提交，开一个 PR 标题前缀为 [traindata_add]。
               分支已经由 workflow 建好并 checkout（见环境变量 TRAINDATA_BRANCH），
               直接在这个分支上提交，不要自己再建分支，也不要 push 到 main：
                 git add -A data/ && git commit -m "data: <本轮摘要>"
                 git push -u origin "$TRAINDATA_BRANCH"
                 gh pr create --base main --head "$TRAINDATA_BRANCH" \
                   --title "[traindata_add] <一句话说明>" --body-file <你写的 body 文件>
               PR body 里必须贴出 validator、audit（预检/复检）、salt.py --check、
               data_writer.py check 的退出码，以及本轮的场景数与 chunk 数。
               不要提交 data/taxonomy.json 的改动；CI 会拒绝验收。
               如果本轮没有任何合法产出，不要开 PR，直接以失败结束并说明原因。

            9. 每个 chunk 8–12 个 case（一个 case 会展开 2–4 条记录，别把记录数当
               case 数）。并行时每个子代理只写自己的一个 chunk，仍遵守 8–12；
               不要在一次模型调用里塞进超过 12 个 case，也不要复制场景凑数。
            10. 特别强调多样性原则：用脚本检查，多样性不足时强制更改，或用子代理更改

            ${{ inputs.prompt_extra }}

      - name: Summarize Qoder CLI transcript
        if: always() && steps.qoder.outputs.output_file != ''
        env:
          QODER_OUTPUT_FILE: ${{ steps.qoder.outputs.output_file }}
        run: |
          set -uo pipefail
          python3 - "$QODER_OUTPUT_FILE" <<'PY'
          import json, sys

          tools, texts, result = [], [], None
          with open(sys.argv[1], encoding="utf-8", errors="replace") as fh:
              for line in fh:
                  line = line.strip()
                  if not line.startswith("{"):
                      continue
                  try:
                      ev = json.loads(line)
                  except json.JSONDecodeError:
                      continue
                  if ev.get("type") == "assistant":
                      for part in (ev.get("message") or {}).get("content") or []:
                          if part.get("type") == "text" and part.get("text"):
                              texts.append(part["text"])
                          elif part.get("type") == "tool_use":
                              raw = part.get("input")
                              if not isinstance(raw, str):
                                  raw = json.dumps(raw, ensure_ascii=False)
                              tools.append((part.get("name") or "?", raw))
                  elif ev.get("type") == "result":
                      result = ev

          print(f"[transcript] {len(texts)} assistant messages / {len(tools)} tool calls")
          for name, raw in tools[:300]:
              print(f"[tool] {name}: {' '.join(raw.split())[:160]}")
          if len(tools) > 300:
              print(f"... {len(tools) - 300} more tool calls (see artifact)")
          for text in texts[-20:]:
              print("::group::assistant")
              print(text[:1500])
              print("::endgroup::")
          if len(texts) > 20:
              print(f"... {len(texts) - 20} earlier assistant messages omitted")
          if result is not None:
              print(f"[result] subtype={result.get('subtype')} is_error={result.get('is_error')} turns={result.get('num_turns')}")
              final = (result.get("result") or "").strip()
              if final:
                  print("::group::final result")
                  print(final[:2000])
                  print("::endgroup::")
          PY

      - name: Upload Qoder CLI transcript
        if: always() && steps.qoder.outputs.output_file != ''
        uses: actions/upload-artifact@v4
        with:
          name: qoder-transcript
          path: ${{ steps.qoder.outputs.output_file }}
          if-no-files-found: ignore
          retention-days: 7

      - name: Show Qoder CLI log tail on failure
        if: failure()
        env:
          QODER_ERROR: ${{ steps.qoder.outputs.error }}
          QODER_OUTPUT_FILE: ${{ steps.qoder.outputs.output_file }}
        run: |
          set -uo pipefail
          if [ -n "${QODER_ERROR:-}" ]; then
            echo "::: tail -n 100 of qodercli stderr :::"
            printf '%s\n' "$QODER_ERROR" | tail -n 100
            echo "::: end stderr :::"
          fi
          if [ -n "${QODER_OUTPUT_FILE:-}" ] && [ -s "$QODER_OUTPUT_FILE" ]; then
            echo "::: tail -n 200 of ${QODER_OUTPUT_FILE} :::"
            tail -n 200 "$QODER_OUTPUT_FILE"
            echo "::: end transcript :::"
          fi

      - name: Verify generated chunks with the skill gates
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          rm -f work/gates_ok
          mkdir -p work

          if ! git fetch --no-tags origin main:refs/remotes/origin/main >/dev/null 2>&1; then
            echo "::warning::fetch origin/main 失败，无法确定本分支基线；不创建兜底 PR"
            exit 0
          fi
          BASE=$(git merge-base origin/main HEAD)
          DIRTY=$(git status --porcelain -- data/chunks data/rounds data/taxonomy.json || true)
          if [ -n "$DIRTY" ]; then
            echo "::error::data/chunks、data/rounds 或 data/taxonomy.json 有未提交改动；本轮必须以 commit 交付"
            printf '%s\n' "$DIRTY"
            exit 1
          fi
          CHANGED=$(git diff --name-only --diff-filter=AM "$BASE"..HEAD -- 'data/chunks/chunk_*.jsonl' || true)
          NEW_ROUNDS=$(git diff --name-only --diff-filter=AM "$BASE"..HEAD -- 'data/rounds/*.json' || true)
          if [ -z "$CHANGED" ] && [ -z "$NEW_ROUNDS" ]; then
            echo "本分支没有新增数据，跳过 gate 校验"
            exit 0
          fi
          if [ -z "$CHANGED" ]; then
            echo "::error::本分支有新的 round manifest，但没有任何 chunk；不算合法产出"
            exit 1
          fi

          OUTSIDE=$(git diff --name-only "$BASE"..HEAD | grep -v '^data/' || true)
          if [ -n "$OUTSIDE" ]; then
            echo "::error::本分支改动了 data/ 之外的文件，训练数据轮次不允许："
            printf '%s\n' "$OUTSIDE"
            exit 1
          fi
          DELETED=$(git diff --name-only --diff-filter=D "$BASE"..HEAD -- data/ || true)
          if [ -n "$DELETED" ]; then
            echo "::error::本分支删除了 data/ 下的文件，训练数据轮次只允许新增："
            printf '%s\n' "$DELETED"
            exit 1
          fi
          MODIFIED=$(git diff --name-only --diff-filter=M "$BASE"..HEAD -- 'data/chunks/chunk_*.jsonl' 'data/inbox/chunk_*.yaml' || true)
          if [ -n "$MODIFIED" ]; then
            echo "::error::本分支修改了已存在的 chunk；旧 chunk 不允许改写，新数据请走新槽位："
            printf '%s\n' "$MODIFIED"
            exit 1
          fi
          if ! git diff --quiet "$BASE"..HEAD -- data/taxonomy.json; then
            echo "::error::data/taxonomy.json 被改动；它是跨 chunk 的稳定契约，拒绝验收"
            exit 1
          fi

          python3 - <<'PY'
          import glob, json
          emails, pairs, pair_keys = [], [], set()
          for path in sorted(glob.glob("data/rounds/*.json")):
              with open(path, encoding="utf-8-sig") as f:
                  doc = json.load(f)
              for addr in doc.get("email_batch", []):
                  if addr not in emails:
                      emails.append(addr)
              for pair in doc.get("email_pairs", []) or []:
                  key = json.dumps(pair, sort_keys=True, ensure_ascii=False)
                  if key not in pair_keys:
                      pair_keys.add(key)
                      pairs.append(pair)
          out = {"emails": emails}
          if pairs:
              out["pairs"] = pairs
          if emails:
              with open("work/verify_emails.json", "w", encoding="utf-8") as f:
                  json.dump(out, f)
          print(f"email whitelist: {len(emails)} addresses / {len(pairs)} pairs from round manifests")
          PY
          MANIFEST=()
          if [ -s work/verify_emails.json ]; then
            MANIFEST=(--email-manifest work/verify_emails.json)
          fi

          for f in $CHANGED; do
            echo "::group::gates $f"
            python3 traindata/scripts/validate_and_integrate.py --check "$f" \
              --taxonomy data/taxonomy.json --expand --require-complete-cases --timeout 300
            python3 traindata/scripts/audit_diversity.py --chunks "$f" \
              --taxonomy data/taxonomy.json --require-injection --strict \
              --require-taxonomy-axes --require-salt --require-library-emails \
              ${MANIFEST[@]+"${MANIFEST[@]}"} --timeout 300
            python3 traindata/scripts/salt.py --check "$f"
            echo "::endgroup::"
          done

          if [ -n "$NEW_ROUNDS" ]; then
            for m in $NEW_ROUNDS; do
              r=$(basename "$m" .json)
              python3 traindata/scripts/data_writer.py check --round "$r" --strict
            done
          else
            python3 traindata/scripts/data_writer.py check --strict
          fi

          touch work/gates_ok
          echo "所有 gate 通过；允许创建兜底 PR"

      - name: Ensure pull request exists
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          BRANCH="${TRAINDATA_BRANCH:-}"
          if [ -z "$BRANCH" ]; then
            echo "没有分支信息，跳过"; exit 0
          fi
          if [ ! -f work/gates_ok ]; then
            echo "gate 复核未通过或没有新增 chunk；不创建兜底 PR"; exit 0
          fi
          if ! git rev-parse --verify --quiet "origin/$BRANCH" >/dev/null; then
            git push -u origin "$BRANCH" || { echo "分支没有可推送内容，跳过"; exit 0; }
          fi
          AHEAD=$(git rev-list --count "origin/main..origin/$BRANCH" 2>/dev/null || echo 0)
          if [ "$AHEAD" -eq 0 ]; then
            echo "分支与 main 无差异，没有数据产出"; exit 0
          fi
          OPEN=$(gh pr list --head "$BRANCH" --state open --json number --jq 'length' 2>/dev/null || echo 0)
          case "$OPEN" in
            ''|*[!0-9]*) OPEN=0 ;;
          esac
          if [ "$OPEN" -gt 0 ]; then
            echo "PR 已存在（$OPEN 个），跳过"; exit 0
          fi
          gh pr create --base main --head "$BRANCH" \
            --title "[traindata_add] 自动补充：${BRANCH}" \
            --body "模型未自行开 PR，此处兜底创建。workflow 已在 Verify generated chunks 步骤对新增 chunk 重跑 validator / audit / salt / check，全部退出码为 0 才会走到这里。"