name: TrainData Generation

on:
  workflow_dispatch:
    inputs:
      prompt_extra:
        description: '额外追加到 prompt 末尾的要求（可留空）'
        required: false
        default: ''
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: traindata-gen-${{ github.ref }}
  cancel-in-progress: false

jobs:
  traindata-gen:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure Git identity and branch
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="traindata/qwen-${GITHUB_RUN_ID}"
          git switch -c "$BRANCH"
          echo "TRAINDATA_BRANCH=$BRANCH" >> "$GITHUB_ENV"
          git --version
          python3 --version

      # Qwen Code 的 run 步骤展开为 `qwen --yolo --prompt "$PROMPT" --output-format json`：
      # 所有工具调用自动批准（含 shell / write / edit），两个 gate 脚本才能真正跑起来。
      # 模型仍然走 Agnes：agnes 提供 OpenAI 兼容 endpoint，正好是 openai_base_url /
      # openai_model 这两个输入的形状。action 会把 openai_api_key 注入成环境变量
      # OPENAI_API_KEY，所以下面 modelProviders 里的 envKey 写的就是它。
      # 上下文 512k / 输出 65536 写了两处，是故意的：
      #  - modelProviders[].generationConfig —— 选中该 provider 条目时生效；
      #  - model.generationConfig —— 只在「没选中 provider 条目」的 Runtime Model
      #    路径下生效。
      # action 是用 OPENAI_MODEL 环境变量传模型 id 的，那属于 Runtime Model 路径，
      # 是否命中 provider 条目取决于 id/protocol/baseUrl 三者匹配。provider 层是
      # "impermeable"（完全替换下层），所以两处同时写不冲突：命中就用前者，没命中
      # 就落到后者。只写一处的话，另一条路径会静默用内置默认值猜上下文大小。
      # （opencode.jsonc 里那行 300k 是旧的，实际额度是 512k；那个文件已不参与 CI。）
      # 不要在这里设 tools.core —— 它是 allowlist，会把 python3 挡掉，导致
      # data_writer.py / validate_and_integrate.py / audit_diversity.py 全部无法执行。
      # 关于"看不到实时日志"：这不是配置错误，是这个 action 的固有限制。
      # 它的 run 步骤硬编码 `qwen --yolo --prompt "$PROMPT" --output-format json`，
      # 且把 stdout/stderr 全重定向进 ${RUNNER_TEMP} 下的临时文件：
      #   qwen ... 2> "${TEMP_STDERR}" 1> "${TEMP_STDOUT}"
      # 只有在 qwen 退出之后，若 qwen_debug 为真才 cat 这些文件。它的 12 个 input
      # 里没有任何流式/实时开关，也没有 tee。所以长跑时必须靠 artifacts 看日志：
      # upload_artifacts 会保留 stdout.log / stderr.log / telemetry.log。
      # 真正想实时就得放弃这个 action、自己 `npm i -g @qwen-code/qwen-code` 并改用
      # --output-format stream-json —— 那等于自己维护一套安装/调用逻辑，稳定性更差，
      # 所以这里不做。qwen_debug 默认打开，跑完至少能拿到完整输出。
      # （另外 qwen 的持久重试心跳只写 stderr，也就是同样被重定向，不会实时出现。）
      - name: Run Qwen Code (Agnes backend)
        uses: QwenLM/qwen-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          openai_api_key: ${{ secrets.AGNES_API_KEY }}
          openai_base_url: ${{ vars.AGNES_BASE_URL || 'https://apihub.agnes-ai.com/v1' }}
          openai_model: ${{ vars.AGNES_MODEL || 'agnes-3.0-flash' }}
          qwen_cli_version: ${{ vars.QWEN_CLI_VERSION }}
          qwen_debug: 'true'
          upload_artifacts: 'true'
          workflow_name: 'traindata-gen'
          settings: |-
            {
              "modelProviders": {
                "openai": [
                  {
                    "id": "agnes-3.0-flash",
                    "name": "Agnes 3 Flash",
                    "envKey": "OPENAI_API_KEY",
                    "baseUrl": "https://apihub.agnes-ai.com/v1",
                    "generationConfig": {
                      "contextWindowSize": 512000,
                      "samplingParams": {
                        "max_tokens": 65536
                      }
                    }
                  }
                ]
              },
              "model": {
                "generationConfig": {
                  "contextWindowSize": 512000,
                  "samplingParams": {
                    "max_tokens": 65536
                  }
                },
                "maxSessionTurns": 200,
                "maxWallTimeSeconds": 10800,
                "maxToolCalls": 1500
              },
              "telemetry": {
                "enabled": true,
                "target": "local",
                "outfile": ".qwen/telemetry.log"
              }
            }
          prompt: |
            安装并使用 ./traindata skill 为Ruhui编写训练数据。

            第 0 条（元规则，优先于以下所有条款）：
            脚本是唯一权威。data_writer.py / validate_and_integrate.py / audit_diversity.py /
            salt.py 的退出码就是判定结果：0 才算通过，非 0 就是没通过。
            - 你必须服从脚本结论，不得改写、绕过、注释掉或放宽任何检查来让它变绿。
            - 不得用自己的判断、自述或"我认为已经修好了"代替脚本判定；
              每次修复后必须重跑脚本，以退出码为准。
            - 子代理同样受此约束：主代理必须要求每个子代理重跑对应脚本并回报退出码，
              子代理自述"已完成/已验证"而无脚本退出码的，一律不予采信。
            - 被脚本拒绝时，按它打印的提示修复数据并重跑；不得手改产物文件。

            硬性要求：
            1. 只允许改动选定的输出根目录（默认 ./data，必须在项目内），
               严禁修改 .github/、traindata/ 或任何已有源码。
               严禁新增任何 .py 脚本（尤其是 author.py / gen.py 之类的生成器）：
               工具已经现成，你只负责输出 YAML 并调用 traindata/scripts/data_writer.py。

            1.1 规则从哪里看（重要）：
               开工前先运行 python3 traindata/scripts/data_writer.py brief，
               它会打印流程、YAML 字段和最常见被拒原因。
               需要细节时读 traindata/SKILL.md 和 traindata/references/*.md。
               不要去读 traindata/scripts/ 下的实现源码（dataloader.py、data_writer.py 等）：
               那是工具内部，读它既不会告诉你该写什么，也容易让你跑去改它。
               如果 brief 和文档没覆盖你的疑问，就按脚本的报错信息修数据并重跑，
               而不是翻源码猜。

            2. 地址只能用 sample_emails.py 的输出：
               先运行 sample_emails.py --scenario <safe|violation> --count N --cross-map
               --manifest <path> --ledger <path> 拿到冻结批次，
               再 allocate --count N --email-manifest <path> 登记它。
               严禁 grep/cat/读取 traindata/assets/email_library/ 下任何文件，
               严禁自己挑域名或用 bash 循环去查"某域名在不在黑名单"。
               理由：那是 28 万行 blocklist，逐个 grep 既慢又没意义；
               手工挑域名会绕过分层加权与 cross-map，让域名变成标签信号。
               write 会拒绝：未登记批次，或样本里出现批次外地址。

            3. 先用 data_writer.py allocate --count N 领取文件名，把纯 YAML 写到它打印的
               data/inbox/chunk_NNNN.yaml（action 写成映射、长文本用 | 块标量），
               再执行 data_writer.py write 转换。严禁手写、手改或另存 jsonl。
               即使使用子代理，也由主代理统一 allocate，子代理只写分配给它的 YAML 槽位；
               子代理完成后必须自己跑 write 并回报退出码，主代理再独立复跑一次确认。

            4. 只用 data_writer.py merge --round <id> 合并，且只合并本轮产出；
               严禁 glob 全部 chunk，严禁私自合并其它轮或文件夹中的样本。

            5. 提交前必须运行 data_writer.py check --round <id> --strict 且通过；
               严禁提交任何临时/备份文件（.tmp-*、*.tmp、*.bak、__pycache__ 等）。

            6. 转换与两个 gate 都要带 --timeout；退出码 3 表示该 chunk 未通过，
               缩小 chunk 重来，不要调大超时。

            7. 计时器：本轮有 3 小时墙钟预算（allocate --budget-hours 可调）。
               命令会显示 ⚠/⛔ 计时提示：
               - ⚠ warn（超过 75%）：把手上这份 YAML 写完，不要再开新场景。
               - ⛔ stop（超过 3 小时）：write 会拒绝新 chunk。此时必须立即执行
                 data_writer.py salvage --round <id> --taxonomy data/taxonomy.json --commit
                 把已完成且合法的部分转换、合并并提交。半成品提交算成功，
                 跑满 3 小时却什么都没交是失败。

            8. 完成后提交，开一个 PR 标题前缀为 [traindata_add]。
               分支已经由 workflow 建好并 checkout（见环境变量 TRAINDATA_BRANCH），
               直接在这个分支上提交，不要自己再建分支，也不要 push 到 main：
                 git add -A data/ && git commit -m "data: <本轮摘要>"
                 git push -u origin "$TRAINDATA_BRANCH"
                 gh pr create --base main --head "$TRAINDATA_BRANCH" \
                   --title "[traindata_add] <一句话说明>" --body-file <你写的 body 文件>
               PR body 里必须贴出各 gate 的退出码，以及本轮的场景数与 chunk 数。
               如果本轮没有任何合法产出，不要开 PR，直接以失败结束并说明原因。

            9. 绝对严禁一次产出超过10个样本，但使用子代理，并且有相应验证时本规则例外
            10. 特别强调多样性原则：用脚本检查，多样性不足时强制更改，或用子代理更改

            ${{ inputs.prompt_extra }}

      # 失败时把 qwen 的日志尾巴直接打到本页，省一次下载 artifact 的动作。
      # 这仍然是"结束后"的输出，不是实时的，别误读。
      - name: Show Qwen Code log tail on failure
        if: failure()
        run: |
          set -uo pipefail
          for f in qwen-artifacts/stderr.log qwen-artifacts/stdout.log qwen-artifacts/telemetry.log; do
            if [ -s "$f" ]; then
              echo "::: tail -n 200 of $f :::"
              tail -n 200 "$f"
              echo "::: end $f :::"
            fi
          done

      # 兜底：模型没按第 8 条开 PR 时，把它在分支上的提交补成一个 PR，
      # 避免"跑了 3 小时、数据在分支上、却看不到 PR"。
      - name: Ensure pull request exists
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          BRANCH="${TRAINDATA_BRANCH:-}"
          if [ -z "$BRANCH" ]; then
            echo "没有分支信息，跳过"; exit 0
          fi
          if ! git rev-parse --verify --quiet "origin/$BRANCH" >/dev/null; then
            git push -u origin "$BRANCH" || { echo "分支没有可推送内容，跳过"; exit 0; }
          fi
          AHEAD=$(git rev-list --count "origin/main..origin/$BRANCH" 2>/dev/null || echo 0)
          if [ "$AHEAD" -eq 0 ]; then
            echo "分支与 main 无差异，没有数据产出"; exit 0
          fi
          OPEN=$(gh pr list --head "$BRANCH" --state open --json number --jq 'length' 2>/dev/null || echo 0)
          case "$OPEN" in
            ''|*[!0-9]*) OPEN=0 ;;   # gh 报错或输出异常时按"没有 PR"处理
          esac
          if [ "$OPEN" -gt 0 ]; then
            echo "PR 已存在（$OPEN 个），跳过"; exit 0
          fi
          gh pr create --base main --head "$BRANCH" \
            --title "[traindata_add] 自动补充：${BRANCH}" \
            --body "模型未自行开 PR，此处兜底创建。请先在 Actions 日志里确认两个 gate 的退出码为 0 再合并。"