      content: |
        {"collection": "parish-scans-1890s", "owner": "Ardleigh University Library", "id": "b41f7d2a-9c63-4c85-8f10-2e6a5d9b7c31", "rule": "Restricted material needs curator sign-off before a researcher account is created.", "curator_available": false}
