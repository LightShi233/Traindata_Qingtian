        The user wants the bundle indexed. The registry policy and the release rule set the bar, so I build the draft first and check which exhibits lack hashes before anything is shared.
      action:
        name: evidence_list_exhibits
        arguments:
          bundle: EV-2291
    - role: environment
      content: |
