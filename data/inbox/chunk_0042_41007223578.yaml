    - role: agent
      thought: |
        E-2 has no source hash, so under the registry policy the index cannot be published. The partner copy waits with it, and the compliance entry can be written now so the release is on record when it happens.
      action:
        name: evidence_create_index
        arguments:
          bundle: EV-2291
          entries: 2
