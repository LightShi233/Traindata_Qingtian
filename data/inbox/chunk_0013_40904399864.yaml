      content: |
        {"ref": "KT-2210", "owner": "Penrhyn Brass Foundry", "buyer_contact": "qianoun@sidemirror53.com", "note": "Kits with cracked moulds must go to the foundry supervisor for sign-off before dispatch.", "components": 9, "packing_total_kg": 41.7}
